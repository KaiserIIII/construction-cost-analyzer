name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm browser test runtime
        run: node --version
      - name: Run standard-library suite
        run: python -X utf8 -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
      - name: Generate worked reports
        run: python -X utf8 -m cost_analyzer demo --output outputs/ci-demo
